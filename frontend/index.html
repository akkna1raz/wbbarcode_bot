<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Поиск товара на Wildberries</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --bg-base: #07080b;
      --card-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.015) 100%);
      --card-border: rgba(255, 255, 255, 0.08);
      --wb-gradient: linear-gradient(135deg, #9333ea 0%, #c026d3 100%);
    }

    html, body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: pan-x pan-y;
      background-color: var(--bg-base);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .num-tabular { font-variant-numeric: tabular-nums; }
    .premium-card { background: var(--card-bg); border: 1px solid var(--card-border); }
    
    .camera-container {
      width: 100%; aspect-ratio: 4 / 3;
      touch-action: none; contain: layout paint size; isolation: isolate;
      transform: translateZ(0);
    }

    #video-wrapper { 
      position: absolute; 
      inset: 0; 
      overflow: hidden; 
      display: block; 
      border-radius: 1rem;
    }
    
    #snapshot-canvas, #native-video, #reader video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important; 
      height: 100% !important;
      object-fit: cover !important; 
      border-radius: 1rem;
      transform-origin: center center; 
      will-change: transform;
    }
    
    #reader { border: none !important; width: 100% !important; height: 100% !important; background: transparent !important; }
    #qr-shaded-region, #reader__scan_region svg, #reader__scan_region img, #reader__dashboard_section_csr, #reader__header_message, #reader__status_span {
      display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important;
    }

    .corner-mark { position: absolute; width: 14px; height: 14px; border-color: rgba(255, 255, 255, 0.75); z-index: 10; }
    .laser-beam {
      position: absolute; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(239, 68, 68, 0.4) 15%, #ef4444 50%, rgba(239, 68, 68, 0.4) 85%, transparent 100%);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      animation: laser-sweep 2.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
    }

    @keyframes laser-sweep { 0% { top: 2px; opacity: 0.35; } 50% { opacity: 1; } 100% { top: calc(100% - 4px); opacity: 0.35; } }
    .animate-enter { animation: enter-motion 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes enter-motion { 0% { opacity: 0; transform: translateY(6px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
  </style>
</head>
<body class="p-3 sm:p-5 md:p-8 flex flex-col items-center justify-start min-h-screen">

  <div class="w-full max-w-md md:max-w-4xl flex flex-col gap-4">
    <header class="border-b border-white/[0.06] pb-3 text-center sm:text-left">
      <h1 class="text-base sm:text-lg font-bold tracking-tight text-white">Сканер товаров</h1>
      <p class="text-xs text-white/40 mt-0.5">Поместите штрихкод в рамку для поиска на Wildberries</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-start">
      <div class="md:col-span-5 flex flex-col gap-2">
        <div id="scanner-wrapper" class="camera-container relative w-full rounded-2xl overflow-hidden bg-black/90 border border-white/10 flex items-center justify-center">
          <div id="video-wrapper">
            <canvas id="snapshot-canvas" class="hidden"></canvas>
            <video id="native-video" class="hidden" playsinline webkit-playsinline muted autoplay></video>
            <div id="reader" class="hidden w-full h-full"></div>
          </div>

          <div id="zoom-badge" class="hidden absolute top-3 left-3 z-30 px-2 py-0.5 rounded-md bg-black/60 border border-white/10 text-[11px] font-mono text-white/60">1.0×</div>

          <button id="btn-torch" type="button" class="hidden absolute top-3 right-3 z-30 w-8 h-8 rounded-lg bg-black/60 border border-white/10 flex items-center justify-center text-white/70 active:scale-95 transition-transform" title="Фонарик">
            <svg id="torch-off-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
            <svg id="torch-on-icon" class="w-4 h-4 hidden text-amber-400 fill-amber-400" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
          </button>

          <div id="scanner-placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center bg-black/90 text-white z-20">
            <div id="placeholder-idle" class="flex flex-col items-center">
              <div class="w-12 h-12 rounded-full bg-white/[0.04] border border-white/10 flex items-center justify-center mb-3">
                <svg class="w-6 h-6 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" /></svg>
              </div>
              <button id="btn-start-scan" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-white flex items-center gap-2 active:scale-95 transition-all shadow-lg" style="background: var(--wb-gradient);">
                Сканировать
              </button>
            </div>
          </div>

          <div id="scanner-overlay" class="hidden absolute inset-0 pointer-events-none z-10 flex items-center justify-center p-3">
            <div class="relative w-[80%] sm:w-[75%] aspect-[2.3/1] flex items-center justify-center">
              <div class="corner-mark top-0 left-0 border-t-[1.5px] border-l-[1.5px] rounded-tl-[3px]"></div>
              <div class="corner-mark top-0 right-0 border-t-[1.5px] border-r-[1.5px] rounded-tr-[3px]"></div>
              <div class="corner-mark bottom-0 left-0 border-b-[1.5px] border-l-[1.5px] rounded-bl-[3px]"></div>
              <div class="corner-mark bottom-0 right-0 border-b-[1.5px] border-r-[1.5px] rounded-br-[3px]"></div>
              <div class="laser-beam"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="md:col-span-7 flex flex-col gap-3">
        <div id="loading-state" class="hidden premium-card rounded-2xl p-6 flex flex-col items-center justify-center text-center animate-enter">
          <div class="w-7 h-7 border-2 border-fuchsia-500 border-t-transparent rounded-full animate-spin"></div>
          <p id="loading-status-text" class="text-xs text-white/60 mt-3 font-medium">Штрихкод распознан…</p>
        </div>

        <div id="error-card" class="hidden premium-card rounded-2xl p-5 text-center border-red-500/20 animate-enter">
          <div class="w-10 h-10 rounded-full bg-red-500/10 text-red-400 border border-red-500/20 mx-auto flex items-center justify-center mb-2.5">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          </div>
          <h3 id="error-title" class="text-xs sm:text-sm font-semibold text-red-400">Ошибка соединения</h3>
          <p id="error-desc" class="text-[11px] sm:text-xs text-white/40 mt-1 mb-4">Проверьте подключение к интернету</p>
          <button id="btn-retry" class="w-full py-2.5 px-4 rounded-xl text-xs font-semibold text-white/80 bg-white/[0.04] border border-white/10 hover:bg-white/[0.08] active:scale-[0.98] transition-all">
            Повторить запрос
          </button>
        </div>

        <div id="not-found-card" class="hidden premium-card rounded-2xl p-5 text-center border-amber-500/20 animate-enter">
          <div class="w-10 h-10 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 mx-auto flex items-center justify-center mb-2.5">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
          </div>
          <h3 id="nf-title" class="text-xs sm:text-sm font-semibold text-white/90">Товар не найден</h3>
          <p id="nf-desc" class="text-[11px] sm:text-xs text-white/40 mt-1 mb-1">Попробуйте отсканировать другой товар</p>
        </div>

        <div id="result-card" class="hidden premium-card rounded-2xl p-4 sm:p-5 flex flex-col gap-3.5 animate-enter">
          <div class="flex items-start gap-3.5">
            <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-xl bg-white/[0.03] border border-white/10 overflow-hidden flex-shrink-0 flex items-center justify-center p-1.5">
              <img id="res-image" src="" alt="Товар" class="w-full h-full object-contain hidden" />
              <svg id="res-image-placeholder" class="w-6 h-6 text-white/30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <span id="res-brand" class="text-[10px] font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded bg-white/[0.06] text-white/70 border border-white/10 truncate max-w-[120px]">Бренд</span>
                <span id="res-article" class="text-[11px] font-mono text-white/40 truncate">Артикул WB: —</span>
              </div>
              <h2 id="res-title" class="text-xs sm:text-sm font-semibold text-white/90 line-clamp-2 leading-snug">Название товара</h2>
            </div>
          </div>

          <div class="h-px w-full bg-white/[0.06]"></div>

          <div class="grid grid-cols-2 gap-3 bg-black/40 p-3 rounded-xl border border-white/[0.06]">
            <div class="flex flex-col justify-center">
              <span class="text-[10px] font-medium text-white/40">Цена WB:</span>
              <span id="res-wb-price" class="text-sm sm:text-base font-semibold text-white/40 line-through num-tabular mt-0.5">—</span>
            </div>
            <div class="flex flex-col justify-center items-end text-right">
              <div class="flex items-center gap-1">
                <span class="text-[9px] font-bold px-1.5 py-0.2 rounded bg-emerald-500/15 text-emerald-400 border border-emerald-500/20">-50%</span>
                <span class="text-[10px] font-medium text-emerald-400">Наша цена:</span>
              </div>
              <span id="res-our-price" class="text-base sm:text-xl font-bold text-white num-tabular tracking-tight mt-0.5">—</span>
            </div>
          </div>

          <a id="res-wb-link" href="#" target="_blank" class="w-full py-3 sm:py-3.5 px-4 rounded-xl text-xs sm:text-sm font-semibold text-white flex items-center justify-center gap-2 active:scale-[0.98] transition-all shadow-lg" style="background: var(--wb-gradient);">
            <span>Открыть на Wildberries</span>
          </a>
        </div>

        <div id="action-buttons" class="w-full hidden animate-enter">
          <button id="btn-rescan" class="w-full py-3 px-4 rounded-xl text-xs font-semibold text-white/60 bg-white/[0.03] border border-white/[0.08] hover:bg-white/[0.06] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            Сканировать другой товар
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
